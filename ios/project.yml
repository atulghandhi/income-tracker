name: IncomeTracker

options:
  bundleIdPrefix: com.incometracker
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "M4XK94CMJX"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

packages:
  supabase-swift:
    url: https://github.com/supabase-community/supabase-swift.git
    from: "2.0.0"
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: "1.17.0"

targets:
  IncomeTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - IncomeTracker/
    info:
      path: IncomeTracker/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Income Tracker"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - incometracker
            CFBundleURLName: com.incometracker.app
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        NSFaceIDUsageDescription: "Used to protect your financial data"
        SUPABASE_URL: "https://hgzacqveqrccnvjwumkz.supabase.co"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnemFjcXZlcXJjY252and1bWt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMDAzNDUsImV4cCI6MjA4ODU3NjM0NX0.ymfxr4YzbspKit3BoVTWICgDiz-DMnCvJb6CZWBQ0wE"
    entitlements:
      path: IncomeTracker/Resources/IncomeTracker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.incometracker
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: IncomeTracker/Resources/IncomeTracker.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.incometracker.app
        APP_GROUP_ID: group.com.incometracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # xcodegen's iOS target defaults set "1,2"; pin to iPhone-only so App
        # Store validation doesn't demand iPad multitasking orientations.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: IncomeTrackerWidgets
      - sdk: WidgetKit.framework
        embed: false
      - package: supabase-swift
        product: Supabase

  IncomeTrackerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - IncomeTrackerWidgets/
    info:
      path: IncomeTrackerWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Income Tracker"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.incometracker.app.widgets
        CODE_SIGN_ENTITLEMENTS: IncomeTrackerWidgets/IncomeTrackerWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"

  IncomeTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - IncomeTrackerTests/
    dependencies:
      - target: IncomeTracker
      - package: swift-snapshot-testing
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.incometracker.tests
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  IncomeTracker:
    build:
      targets:
        IncomeTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IncomeTrackerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  IncomeTrackerTests:
    build:
      targets:
        IncomeTrackerTests: [build, test]
    test:
      config: Debug
      targets:
        - IncomeTrackerTests
