name: IncomeTracker

options:
  bundleIdPrefix: com.incometracker
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

packages:
  supabase-swift:
    url: https://github.com/supabase-community/supabase-swift.git
    from: "2.0.0"
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: "1.17.0"

targets:
  IncomeTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - IncomeTracker/
    info:
      path: IncomeTracker/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Income Tracker"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - incometracker
            CFBundleURLName: com.incometracker.app
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        NSFaceIDUsageDescription: "Used to protect your financial data"
        NSCameraUsageDescription: ""
    entitlements:
      path: IncomeTracker/Resources/IncomeTracker.entitlements
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: IncomeTracker/Resources/IncomeTracker.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.incometracker.app
        APP_GROUP_ID: group.com.incometracker
    dependencies:
      - target: IncomeTrackerWidgets
      - target: IncomeTrackerIntents
      - package: supabase-swift
        product: Supabase

  IncomeTrackerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - IncomeTrackerWidgets/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.incometracker.app.widgets
    dependencies:
      - package: supabase-swift
        product: Supabase

  IncomeTrackerIntents:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - IncomeTrackerIntents/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.incometracker.app.intents

  IncomeTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - IncomeTrackerTests/
    dependencies:
      - target: IncomeTracker
      - package: swift-snapshot-testing
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.incometracker.tests

schemes:
  IncomeTracker:
    build:
      targets:
        IncomeTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IncomeTrackerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  IncomeTrackerTests:
    build:
      targets:
        IncomeTrackerTests: [build, test]
    test:
      config: Debug
      targets:
        - IncomeTrackerTests
